<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Logout - LifePilot AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef6ff, #f8fbff);
            min-height: 100vh;
            color: #1f2937;
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            border: 1px solid #e1e8f0;
            box-shadow: 0 12px 35px rgba(0, 60, 120, 0.10);
            text-align: center;
        }

        .icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #fff1f1;
            border: 1px solid #ffd6d6;
            border-radius: 20px;

            font-size: 32px;
        }

        h1 {
            margin: 0;
            color: #073b70;
            font-size: 27px;
        }

        .message {
            color: #64748b;
            font-size: 15px;
            margin: 12px 0 25px;
            line-height: 1.5;
        }

        .logout-btn {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #e53935,
                #c62828
            );

            color: white;
            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.2s;
        }

        .logout-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 7px 18px rgba(198, 40, 40, 0.20);
        }

        .back {
            display: flex;
            justify-content: center;

            margin-top: 18px;

            color: #073b70;
            text-decoration: none;

            font-size: 14px;
            font-weight: bold;
        }

        .back:hover {
            color: #1597e5;
        }

        .security {
            margin-top: 22px;
            color: #94a3b8;
            font-size: 12px;
        }

        @media (max-width: 600px) {

            .page {
                padding: 15px;
            }

            .card {
                padding: 27px 20px;
                border-radius: 17px;
            }

            .icon {
                width: 62px;
                height: 62px;
                font-size: 28px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="card">

        <div class="icon">
            🚪
        </div>

        <h1>Logout</h1>

        <p class="message">
            Are you sure you want to logout from LifePilot AI?
        </p>

        <form method="POST">

            {% csrf_token %}

            <button
                type="submit"
                class="logout-btn"
            >
                Yes, Logout
            </button>

        </form>

        <a
            class="back"
            href="/dashboard/"
        >
            ← Cancel
        </a>

        <div class="security">
            🔐 Your session will be securely ended
        </div>

    </div>

</div>

</body>
</html>
